version: '3.8'

services:
  backend:
    build:
      context: ./_backend
      dockerfile: Dockerfile
    container_name: uvcs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend_data:/app/data
      - ./backend_media:/app/media
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
      - MEDIA_DIR=/app/media
      - BASE_URL=https://www.uvcs.info
    networks:
      - uvcs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uvcs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - uvcs-network

networks:
  uvcs-network:
    driver: bridge

volumes:
  backend_data:
  backend_media:

